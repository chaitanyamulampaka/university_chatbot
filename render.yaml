services:
  - type: web
    name: university-chatbot
    runtime: python
    pythonVersion: 3.10
    
    # Build command: Install dependencies and preload the model
    buildCommand: pip install -r requirements.txt && python preload_model.py
    
    # Start command: Run FastAPI with Uvicorn, binding to Render-provided port
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    
    # Environment variables (add via Dashboard)
    envVars:
      - key: HF_HUB_OFFLINE
        value: "1"
      - key: GOOGLE_API_KEY
        scope: runtime
        sync: false
    
    # Health check endpoint
    healthCheckPath: /health
    
    # Auto-deploy on git push
    autoDeploy: true
