services:
  - type: web
    name: university-chatbot
    runtime: python
    pythonVersion: "3.11.9"

    # Build: install deps, download HF models, create admissions DB
    buildCommand: pip install -r requirements.txt && python preload_model.py && python create_admissions_db.py

    # Entry point
    startCommand: uvicorn integrated_main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: GOOGLE_API_KEY
        scope: runtime
        sync: false
      - key: GEMINI_API_KEY
        scope: runtime
        sync: false

    healthCheckPath: /health
    autoDeploy: true